{% set name = "tenacity" %}
{% set version = "9.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a606b5c808d0cded4a359d5b9932d867ff2a6a6b64d37350260fd01bbdf83839

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install -vv --no-deps --no-build-isolation .

requirements:
  host:
    - pip
    - toml
    - python
    - setuptools_scm >=3.4
    - hatchling
    - hatch-vcs
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - tenacity
  requires:
    - pip
    - pytest
    - tornado >=4.5
    - typeguard
  commands:
    - pip check
    - pytest tests

about:
  home: https://github.com/jd/tenacity
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: Retry a flaky function whenever an exception occurs until it works
  description: |
    Tenacity is general-purpose retrying library, written in Python, to simplify the task of
    adding retry behavior to just about anything. It originates from a fork of Retrying
  doc_url: https://tenacity.readthedocs.io
  dev_url: https://github.com/jd/tenacity

extra:
  recipe-maintainers:
    - sodre
    - xylar
